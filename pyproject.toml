[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "kentik-api"
description = "Kentik API SDK: generated v6 client (sync and async) plus the legacy v5 client"
authors = [
    { name = "Martin Machacek", email = "martin.machacek@kentik.com" },
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    # v6 client (kentik_api.v6)
    "httpx>=0.28",
    "pydantic>=2.11",
    # legacy 1.x clients (v5 REST, synthetics v202202 / cloud_export v202101beta1 over gRPC)
    "dacite>=1.8",
    "requests[socks]>=2.32.4",
    "typing-extensions>=4.12",
    "protobuf>=7.35.1,<8",
    "grpcio>=1.85.1",
    "googleapis-common-protos>=1.70",
]

[project.optional-dependencies]
analytics = [
    "pandas>=2.2",
    "pyyaml>=6.0.2",
    "fastparquet>=2024.11.0",
]

[project.urls]
Homepage = "https://github.com/kentik/community_sdk_python"
Source = "https://github.com/kentik/community_sdk_python"
Changelog = "https://github.com/kentik/community_sdk_python/blob/main/CHANGELOG.md"
Issues = "https://github.com/kentik/community_sdk_python/issues"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.18",
    "pytest>=8.4",
    "httpretty>=1.1.4",
    "grpcio-tools>=1.85.1",
    "types-protobuf>=6.30",
    "types-requests>=2.32",
    "types-PyYAML>=6.0.12",
    "datamodel-code-generator==0.92.0",
    "respx>=0.22",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.sdist]
include = [
    "/kentik_api",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/docs/UPGRADING.md",
    "/kentik-api.json",
]

[tool.hatch.build.targets.wheel]
packages = ["kentik_api"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["kentik_api/generated", "examples/demos"]

[tool.ruff.format]
exclude = ["*.md"]  # keep hand-aligned snippets in the docs

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "S", "PIE", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "S101",   # assert is fine in tests and internal invariants
]

[tool.ruff.lint.per-file-ignores]
# The 1.x code base predates ruff; keep it lint-clean on correctness rules only and do not churn it.
"kentik_api/{analytics,api_calls,api_connection,api_resources,auth,cloudexport,internal,public,requests_payload,synthetics,utils}/**" = [
    "UP", "B", "BLE", "S", "PIE", "RUF", "F401", "F403", "F405", "E712", "E721", "E741",
]
"kentik_api/{__init__,kentik_api,version}.py" = ["F401", "F403", "E402", "UP"]
"tests/{unit,integration,library,e2e}/**" = ["UP", "B", "BLE", "S", "PIE", "RUF", "F401", "F403", "F405", "E712", "E741"]
"examples/**" = ["UP", "B", "BLE", "S", "PIE", "RUF", "F401", "E741", "T201"]
"scripts/**" = ["S603", "S607"]
# generated from the schema: names and docstrings come from the protos
"kentik_api/v6/services/**" = ["S105", "W291", "E501", "RUF001", "RUF002", "RUF003"]
"tests/v6/**" = ["S105", "S106"]

[tool.mypy]
# Strict on code added in 2.x (kentik_api.v6, scripts, tests/v6). The 1.x code base is frozen and
# predates current mypy; it is type-checked only to the level it was written for (see AGENTS.md).
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = "(build|dist|kentik_api/generated)/"

[[tool.mypy.overrides]]
# legacy protobuf stubs: treated as Any, as in 1.x
module = ["kentik_api.generated.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "kentik_api",
    "kentik_api.kentik_api",
    "kentik_api.version",
    "kentik_api.analytics.*",
    "kentik_api.api_calls.*",
    "kentik_api.api_connection.*",
    "kentik_api.api_resources.*",
    "kentik_api.auth.*",
    "kentik_api.cloudexport.*",
    "kentik_api.internal.*",
    "kentik_api.public.*",
    "kentik_api.requests_payload.*",
    "kentik_api.synthetics.*",
    "kentik_api.utils.*",
    "tests.unit.*",
    "tests.integration.*",
    "tests.library.*",
    "tests.e2e.*",
    "examples.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
# new examples are checked strictly like the rest of the 2.x code
module = ["examples.v6.*"]
ignore_errors = false

[[tool.mypy.overrides]]
module = ["httpretty.*", "pandas.*", "fastparquet.*", "grpc.*", "grpc_tools.*", "dacite.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/integration", "tests/unit", "tests/tooling", "tests/v6"]
addopts = "-ra"
filterwarnings = [
    # 1.x tests exercise the deprecated client on purpose; tests/v6 asserts the warning explicitly
    "ignore:kentik_api.KentikAPI is deprecated:DeprecationWarning",
]
